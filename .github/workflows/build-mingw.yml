name: build-mingw
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64
      - name: Normalize includes
        run: find . -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 sed -i '/^[[:space:]]*#/s|\\|/|g'
      - name: Build
        run: x86_64-w64-mingw32-g++ -O2 -std=c++20 -static -funsigned-char -D_CHAR_UNSIGNED -fpermissive -o ljd2.exe main.cpp ast/ast.cpp bytecode/bytecode.cpp bytecode/prototype.cpp lua/lua.cpp -luser32 -lshlwapi 2>&1
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ljd2
          path: ljd2.exe
